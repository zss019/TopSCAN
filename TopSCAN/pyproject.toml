[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topscan"
version = "1.0.0"
description = "TopSCAN: Structure-Aware Sparse Cross-Modal Alignment for Multimodal Attributed Graphs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "TopSCAN Authors" }]
keywords = [
    "graph-neural-networks",
    "multimodal-learning",
    "cross-modal-attention",
    "sparse-alignment",
    "digital-platforms",
    "dgl",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=1.13.0",
    "dgl>=1.1.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.62.0",
]

[project.optional-dependencies]
ogb = ["ogb>=1.3.0"]
dev = ["pytest>=7.0", "black>=23.0", "isort>=5.12"]

[project.urls]
Homepage = "https://github.com/your-org/TopSCAN"
Repository = "https://github.com/your-org/TopSCAN"

[tool.setuptools.packages.find]
where = ["src"]
include = ["topscan*"]
